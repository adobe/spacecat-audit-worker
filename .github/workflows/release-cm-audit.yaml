name: release-cm-audit

# On-demand audit/backfill of Change Management blocks on this repo's production releases.
# report = list releases missing a block; suggest = show what would be written; fix = write it.
on:
  workflow_dispatch:
    inputs:
      since:
        description: Validate releases published on/after this date (YYYY-MM-DD)
        required: true
        type: string
      mode:
        description: report | suggest | fix
        required: true
        type: choice
        options: [report, suggest, fix]
        default: report

permissions:
  contents: write        # fix mode edits release bodies
  pull-requests: read    # read PR author/reviews/labels/assessment

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4        # for .snow.yml
        with:
          persist-credentials: false
      # Pin to a full commit SHA once mysticat-ci publishes the action; using @v1 until then.
      - uses: adobe/mysticat-ci/.github/actions/release-cm-audit@v1
        with:
          since: ${{ inputs.since }}
          mode: ${{ inputs.mode }}
